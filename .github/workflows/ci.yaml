name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install editable package & test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pandas pyarrow
      - name: Run smoke tests (imports)
        env:
          TEST_MODE: '1'
        run: |
          pytest -q --junitxml=pytest-junit.xml | tee pytest-full.log
      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifacts
          retention-days: 14
          path: |
            pytest-junit.xml
            pytest-full.log
            logs/ask_and_analyze_debug.log

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e
        run: echo "pass"
